name: mobile_mylife
description: "Mobile App for Portfolio and User Management - MyLife"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Network & Token Storage
  dio: ^5.8.0+1
  flutter_secure_storage: ^9.2.4

  # UI & Design System
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.17
  percent_indicator: ^4.2.5
  fl_chart: ^0.70.2
  smooth_page_indicator: ^1.2.1

  # Image Picker & Files
  image_picker: ^1.1.2

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  google_sign_in: ^6.2.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
